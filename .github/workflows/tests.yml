name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No dependencies: the tests use node:test and the app's own modules.
      - run: npm test
